<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Contraseña segura</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">✦</div>
    <p class="eyebrow">EJERCICIO 2 · FORMULARIO</p>
    <h1>Crea tu cuenta</h1>
    <p class="intro">Elige una contraseña segura para proteger tu espacio.</p>
    <form id="signup-form" novalidate>
      <label for="password">Contraseña</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="requirements" required>
        <button id="toggle-password" class="toggle" type="button" aria-pressed="false">👁 Mostrar</button>
      </div>
      <fieldset id="requirements" class="requirements">
        <legend>Tu contraseña debe tener:</legend>
        <p data-rule="length"><span aria-hidden="true">○</span> Al menos 8 caracteres</p>
        <p data-rule="uppercase"><span aria-hidden="true">○</span> Una letra mayúscula</p>
        <p data-rule="number"><span aria-hidden="true">○</span> Un número</p>
      </fieldset>
      <button class="submit" type="submit">Crear cuenta</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
